# Inclure dans le bloc server, avant la location generique des fichiers PHP.
# Equivalent des protections et des adresses publiques de .htaccess.
autoindex off;
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json application/xml image/svg+xml;

location ~* ^/(app|bin|storage|tests|textes|php)(/|$) {
    deny all;
}
location ~ (^|/)\.(?!well-known(/|$)) {
    deny all;
}
location ~* (^|/)charte-graphique\.txt$ {
    deny all;
}
location ~* \.(css|js)$ {
    expires 1y;
    try_files $uri =404;
}
location ~* \.(png|jpe?g|webp|svg|ico)$ {
    expires 30d;
    try_files $uri =404;
}

location = /robots.txt {
    rewrite ^ /robots.php last;
}
location = /sitemap.xml {
    rewrite ^ /sitemap.php last;
}
location = /mentions-legales.html {
    return 301 /mentions-legales.php$is_args$args;
}
if ($request_uri ~ "^/index\.(php|html)(\?|$)") {
    return 301 /$is_args$args;
}
